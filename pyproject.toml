[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "openrund"
dynamic = ["version"]
description = "Governed runtime semantics for durable agent runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
  { name = "Issam Ibnouhsein" },
]
keywords = [
  "agents",
  "durable-execution",
  "event-sourcing",
  "governance",
  "runtime",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
openrund = "openrund.__main__:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openrund"]

[tool.hatch.version]
path = "src/openrund/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/README.md",
  "/SECURITY.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src/openrund",
]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
  "live_provider: opt-in real provider drift checks requiring explicit environment configuration",
]

[tool.coverage.run]
branch = true
source = ["openrund"]

[tool.coverage.report]
fail_under = 79
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["src/openrund", "tests", "examples"]
mypy_path = ["src"]
strict = true
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "RUF", "SIM", "UP"]
